# Umami reverse proxy for analytics.carabetta.xyz

server {
    listen 80;
    listen [::]:80;
    server_name analytics.carabetta.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name analytics.carabetta.xyz;

    ssl_certificate /etc/letsencrypt/live/analytics.carabetta.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.carabetta.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/analytics-access.log;
    error_log /var/log/nginx/analytics-error.log;

    # Access SSO bridge: mint Umami JWT for allowlisted CF Access emails
    location = /api/sso-bridge {
        proxy_pass http://127.0.0.1:3012/token;
        proxy_set_header Cf-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    # Replace Umami login UI with Access SSO bridge page
    location = /login {
        root /var/www/umami-sso;
        try_files /login.html =404;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
