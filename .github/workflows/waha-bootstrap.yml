# One-shot / idempotent WAHA sidecar on the ARV box.
# Does not deploy Arquivo. Does not touch develop/master app images.
name: WAHA bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/waha-bridge-9ca0
    paths:
      - 'scripts/bootstrap-waha.sh'
      - 'scripts/fetch-waha-qr.sh'
      - '.github/workflows/waha-bootstrap.yml'

jobs:
  inspect-obs:
    name: Inspect observability VPS
    runs-on: ubuntu-latest
    steps:
      - name: Read-only obs inventory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OBS_VPS_HOST }}
          username: ${{ secrets.OBS_VPS_USER }}
          key: ${{ secrets.OBS_VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            echo "=== obs inspect ==="
            hostname
            free -h
            df -h /
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
            echo "--- nginx ---"
            ls /etc/nginx/sites-enabled || true
            echo "--- waha? ---"
            test -d /opt/waha && echo WAHA_DIR=yes || echo WAHA_DIR=no
            awk '/MemAvailable:/ {print "MemAvailable_MiB", int($2/1024)}' /proc/meminfo

  bootstrap-arv:
    name: Bootstrap WAHA on ARV
    runs-on: ubuntu-latest
    needs: inspect-obs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy and run bootstrap on ARV
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          install -m 600 /dev/null "${HOME}/.ssh/vps"
          printf '%s\n' "${VPS_SSH_KEY}" | sed 's/\\n/\n/g' > "${HOME}/.ssh/vps"
          ssh-keyscan -H "${VPS_HOST}" >> "${HOME}/.ssh/known_hosts" 2>/dev/null || true
          scp -i "${HOME}/.ssh/vps" -o StrictHostKeyChecking=accept-new \
            scripts/bootstrap-waha.sh "${VPS_USER}@${VPS_HOST}:/tmp/bootstrap-waha.sh"
          ssh -i "${HOME}/.ssh/vps" -o StrictHostKeyChecking=accept-new \
            "${VPS_USER}@${VPS_HOST}" 'chmod 700 /tmp/bootstrap-waha.sh && bash /tmp/bootstrap-waha.sh'

      - name: Refresh and pull QR images
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh" qr-out
          chmod 700 "${HOME}/.ssh"
          install -m 600 /dev/null "${HOME}/.ssh/vps"
          printf '%s\n' "${VPS_SSH_KEY}" | sed 's/\\n/\n/g' > "${HOME}/.ssh/vps"
          scp -i "${HOME}/.ssh/vps" -o StrictHostKeyChecking=accept-new \
            scripts/fetch-waha-qr.sh "${VPS_USER}@${VPS_HOST}:/tmp/fetch-waha-qr.sh"
          ssh -i "${HOME}/.ssh/vps" -o StrictHostKeyChecking=accept-new \
            "${VPS_USER}@${VPS_HOST}" 'chmod 700 /tmp/fetch-waha-qr.sh && bash /tmp/fetch-waha-qr.sh'
          scp -i "${HOME}/.ssh/vps" -o StrictHostKeyChecking=accept-new \
            "${VPS_USER}@${VPS_HOST}:/opt/waha/qr/*.png" qr-out/ || true
          ls -la qr-out || true

      - name: Upload QR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waha-qr
          path: qr-out/*.png
          if-no-files-found: warn
          retention-days: 1
