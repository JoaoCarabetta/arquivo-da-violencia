# One-shot / idempotent WAHA sidecar on the ARV box.
# Does not deploy Arquivo. Does not touch develop/master app images.
name: WAHA bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/waha-bridge-9ca0
    paths:
      - 'scripts/bootstrap-waha.sh'
      - '.github/workflows/waha-bootstrap.yml'

jobs:
  inspect-obs:
    name: Inspect observability VPS
    runs-on: ubuntu-latest
    steps:
      - name: Read-only obs inventory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OBS_VPS_HOST }}
          username: ${{ secrets.OBS_VPS_USER }}
          key: ${{ secrets.OBS_VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            echo "=== obs inspect ==="
            hostname
            free -h
            df -h /
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
            echo "--- nginx ---"
            ls /etc/nginx/sites-enabled || true
            echo "--- waha? ---"
            test -d /opt/waha && echo WAHA_DIR=yes || echo WAHA_DIR=no
            awk '/MemAvailable:/ {print "MemAvailable_MiB", int($2/1024)}' /proc/meminfo

  bootstrap-arv:
    name: Bootstrap WAHA on ARV
    runs-on: ubuntu-latest
    needs: inspect-obs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run bootstrap on ARV
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script_path: scripts/bootstrap-waha.sh

      - name: Fetch QR images if present
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            mkdir -p /tmp/waha-qr
            cp -a /opt/waha/qr/*.png /tmp/waha-qr/ 2>/dev/null || true
            ls -la /opt/waha/qr || true
            test -f /opt/waha/BOOTSTRAP.txt && sed 's/=.*key.*/=[redacted]/' /opt/waha/BOOTSTRAP.txt || true
            echo "QR_COUNT=$(find /opt/waha/qr -name '*.png' 2>/dev/null | wc -l)"
