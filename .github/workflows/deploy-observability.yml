# =============================================================================
# Observability stack deployment (Prometheus + Grafana on dedicated VPS)
# =============================================================================
# Triggers on master only when infra/observability changes.
# Scrapes production API (:8000) and worker (:9091) metrics.
# =============================================================================

name: Deploy Observability

on:
  push:
    branches:
      - master
    paths:
      - 'infra/observability/**'
      - '.github/workflows/deploy-observability.yml'
  workflow_dispatch:

jobs:
  deploy-observability:
    name: Deploy to Observability VPS
    runs-on: ubuntu-latest

    steps:
      # The carabetta.xyz zone lives on Cloudflare; the zone token lives only on
      # the prod VPS (/root/.cloudflare_api_token). Ensure the observability A
      # record exists and is DNS-only (proxying breaks the deploy DNS precheck
      # and MCP streaming) before deploying the stack.
      - name: Ensure observability DNS record (Cloudflare)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -uo pipefail
            OBS_IP='${{ secrets.OBS_VPS_HOST }}'
            export OBS_IP
            CF_API_TOKEN="$(cat /root/.cloudflare_api_token)"
            export CF_API_TOKEN
            attempt=0
            until python3 - <<'PYEOF'
            import json, os, sys, urllib.request

            token = os.environ["CF_API_TOKEN"].strip()
            obs_ip = os.environ["OBS_IP"].strip()
            domain = "observability.carabetta.xyz"
            base = "https://api.cloudflare.com/client/v4"

            def api(path, method="GET", body=None):
                req = urllib.request.Request(
                    base + path,
                    data=json.dumps(body).encode() if body else None,
                    method=method,
                    headers={"Authorization": f"Bearer {token}",
                             "Content-Type": "application/json"})
                with urllib.request.urlopen(req, timeout=30) as resp:
                    out = json.load(resp)
                if not out.get("success"):
                    raise RuntimeError(f"CF API {method} {path} failed: {out.get('errors')}")
                return out["result"]

            zones = api("/zones?name=carabetta.xyz")
            if not zones:
                raise RuntimeError("zone carabetta.xyz not found for this token")
            zone_id = zones[0]["id"]
            recs = api(f"/zones/{zone_id}/dns_records?type=A&name={domain}")
            body = {"type": "A", "name": domain, "content": obs_ip, "ttl": 300,
                    "proxied": False,
                    "comment": "observability VPS (Grafana + MCP), managed by deploy-observability.yml"}
            if not recs:
                api(f"/zones/{zone_id}/dns_records", "POST", body)
                print(f"Created DNS-only A {domain}")
            elif recs[0]["content"] != obs_ip or recs[0]["proxied"]:
                api(f"/zones/{zone_id}/dns_records/{recs[0]['id']}", "PUT", body)
                print(f"Updated A {domain} (DNS-only)")
            else:
                print("DNS record already correct")
            PYEOF
            do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "ERROR: Cloudflare DNS ensure failed after $attempt attempts"
                exit 1
              fi
              echo "Cloudflare DNS ensure failed (attempt $attempt), retrying in 10s"
              sleep 10
            done

      - name: Deploy observability stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OBS_VPS_HOST }}
          username: ${{ secrets.OBS_VPS_USER }}
          key: ${{ secrets.OBS_VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /root/arquivo-da-violencia
            git fetch origin master
            git checkout master
            git reset --hard origin/master
            export GRAFANA_ADMIN_PASSWORD='${{ secrets.GRAFANA_ADMIN_PASSWORD }}'
            export PROD_HOST='${{ secrets.VPS_HOST }}'
            bash infra/observability/deploy-remote.sh

      - name: Allow observability VPS scrape on production firewall
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            OBS_IP='${{ secrets.OBS_VPS_HOST }}'
            ufw allow from "$OBS_IP" to any port 8000 proto tcp comment 'Prometheus scrape API' >/dev/null 2>&1 || true
            ufw allow from "$OBS_IP" to any port 9091 proto tcp comment 'Prometheus scrape worker' >/dev/null 2>&1 || true
            ufw allow from "$OBS_IP" to any port 9100 proto tcp comment 'Prometheus scrape node_exporter' >/dev/null 2>&1 || true
            ufw allow from "$OBS_IP" to any port 8011 proto tcp comment 'Prometheus scrape automoney' >/dev/null 2>&1 || true
            echo "UFW rules for $OBS_IP → :8000/:9091/:9100/:8011 applied"
